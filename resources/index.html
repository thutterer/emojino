<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Emojino</title>
    <link rel="stylesheet" href="/styles.css" />
    <script src="/js/neutralino.js"></script>
    <script type="module" src="/js/emoji-picker-element.js"></script>
    <script defer src="/js/alpine.js"></script>
  </head>
  <body>
    <div
      x-data="{ showNotice: false }"
      x-init="
        Neutralino.init()

        // Ensure the app exits fully when the window is closed
        Neutralino.events.on('windowClose', () => {
          Neutralino.app.exit();
        });
      "
      @keydown.escape.window="Neutralino.app.exit()"
    >
      <emoji-picker
        x-init="
          $el.shadowRoot.querySelector('#search').focus();
          Neutralino.window.setDraggableRegion($el.shadowRoot.querySelector('#skintone-button'));
        "
        @emoji-click="async (event) => {
          await Neutralino.clipboard.writeText(event.detail.unicode);
          showNotice = true;
          setTimeout(() => showNotice = false, 1000)
        }"
      ></emoji-picker>
      <div class="notice-container" x-cloak x-show="showNotice" x-transition>
        <span class="notice">Copied</span>
      </div>
    </div>
  </body>
</html>
